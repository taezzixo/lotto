name: 로또 데이터 수집·검사

on:
  schedule:
    - cron: '*/10 12-14 * * 6'   # 토 21:00~23:50 KST, 10분 간격 (이미 확정이면 수 초 만에 종료)
    - cron: '7 0 * * 0'          # 일 09:07 KST 백스톱
    - cron: '7 0 * * 1'          # 월 09:07 KST 최종 백스톱
  workflow_dispatch:
    inputs:
      seed:
        description: '1회~최신 전체를 미러 3곳 교차검증으로 재구축'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: lotto-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test            # 계산 로직(node --test) + 수집·데이터 무결성(unittest)
      - run: npm run build

  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 수집 전 테스트
        run: python -m unittest discover -s scripts -v

      - name: 수집 (표준 라이브러리만 사용)
        id: etl
        env:
          LOTTO_OFFICIAL_BASE: ${{ secrets.LOTTO_OFFICIAL_BASE }}   # 비워두면 동행복권 직접 호출
        run: python scripts/update_lotto.py ${{ inputs.seed && '--seed' || '' }}

      - name: 수집 후 데이터 재검증   # SLA 실패(exit 1)여도 수집분은 검증
        id: recheck
        if: always() && steps.etl.outcome != 'skipped'
        run: python -m unittest discover -s scripts -k StoredDataTests

      - name: 커밋·푸시 (재검증 통과한 데이터만)
        if: always() && steps.recheck.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --staged --quiet && echo "변경 없음" && exit 0
          latest=$(python -c "import json;print(json.load(open('public/data/latest.json'))['latest']['no'])")
          git commit -m "data: 로또 제${latest}회 반영"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: 실패 알림 (이슈)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-pipeline --color B60205 --force >/dev/null
          open=$(gh issue list --label data-pipeline --state open --json number --jq 'length')
          [ "$open" = "0" ] || exit 0
          gh issue create --label data-pipeline \
            --title "로또 데이터 수집 실패 ($(date -u +%F))" \
            --body "실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
